openapi: 3.1.0
info:
  title: Enterprise Workflow Operations API
  version: 1.0.0
  description: >-
    Portfolio integration API for item master, inventory visibility and workflow-driven
    purchase requests. The demo uses HTTP Basic authentication; production public APIs
    should use token/OAuth authentication behind HTTPS.
servers:
  - url: http://127.0.0.1:8000/api/v1
security:
  - basicAuth: []
paths:
  /items:
    get:
      summary: List active item master records
      tags: [Inventory]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        '200':
          description: Paginated item collection
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inventory-stocks:
    get:
      summary: List warehouse stock positions
      tags: [Inventory]
      parameters:
        - in: query
          name: low_stock
          schema: { type: boolean }
        - in: query
          name: warehouse_id
          schema: { type: integer }
      responses:
        '200':
          description: Paginated stock collection
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /purchase-requests:
    get:
      summary: List purchase requests visible to the authenticated user
      tags: [Procurement]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        '200':
          description: Least-privilege paginated purchase request collection
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Submit a purchase request into the configured workflow
      tags: [Procurement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequestInput'
      responses:
        '201':
          description: Purchase request created and submitted to workflow
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation error
  /purchase-requests/{purchaseRequest}:
    get:
      summary: Get one authorized purchase request
      tags: [Procurement]
      parameters:
        - in: path
          name: purchaseRequest
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Purchase request resource
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  responses:
    Unauthenticated:
      description: Authentication required
    Forbidden:
      description: Authenticated user does not have permission for the operation
  schemas:
    PurchaseRequestInput:
      type: object
      required: [purpose, items]
      properties:
        purpose:
          type: string
          maxLength: 3000
        required_date:
          type: [string, 'null']
          format: date
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [item_id, quantity, estimated_unit_cost]
            properties:
              item_id: { type: integer }
              quantity: { type: number, exclusiveMinimum: 0 }
              estimated_unit_cost: { type: number, minimum: 0 }
              note: { type: [string, 'null'], maxLength: 1000 }
