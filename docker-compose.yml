services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:Msa3VGZYYgIWY566F9Dsv9UdMvZYcXZkuqR63m0o4jQ=
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: enterprise_erp
      DB_USERNAME: enterprise
      DB_PASSWORD: enterprise
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --queue=notifications,default --tries=3 --timeout=30
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:Msa3VGZYYgIWY566F9Dsv9UdMvZYcXZkuqR63m0o4jQ=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: enterprise_erp
      DB_USERNAME: enterprise
      DB_PASSWORD: enterprise
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: enterprise_erp
      MYSQL_USER: enterprise
      MYSQL_PASSWORD: enterprise
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
